spring:
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:taskdb
    driverClassName: org.h2.Driver
    username: sa
    password: password

  # H2 Console Settings
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate Settings
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  security:
    user:
      name: admin
      password: password123

# Swagger UI Path
springdoc:
  swagger-ui:
    path: /swagger-ui.html