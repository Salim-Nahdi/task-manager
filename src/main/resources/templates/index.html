<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Task Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h1 class="mb-4">Task Manager</h1>

<div class="row mb-4">
    <div class="col-md-6">
        <form th:action="@{/}" method="get" class="d-flex">
            <input type="text" name="search" th:value="${searchKeyword}"
                   class="form-control me-2" placeholder="Search tasks...">
            <button class="btn btn-outline-primary" type="submit">Search</button>
            <a th:href="@{/}" class="btn btn-outline-secondary ms-1">Clear</a>
        </form>
    </div>
</div>

<div class="card card-body mb-4">
    <h3>Add New Task</h3>
    <form th:action="@{/add-task}" th:object="${task}"   method="post" class="row g-3">
        <div class="col-md-5">
            <input type="text" th:field="*{title}" class="form-control"
                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                   placeholder="Task title">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="${task.title}">
                Error message will appear here
            </div>
        </div>
        <div class="col-md-5">
            <input type="text" name="description" class="form-control" placeholder="Description">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Task</button>
        </div>
    </form>
</div>

<table class="table table-striped">
    <thead>
    <tr>
        <th>Status</th>
        <th>Title</th>
        <th>Description</th>
        <th>Created</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : ${tasks}">
        <td>
            <span th:if="${task.completed}" class="badge bg-success">Done</span>
            <span th:unless="${task.completed}" class="badge bg-warning text-dark">Pending</span>
        </td>
        <td th:text="${task.title}">Task Title</td>
        <td th:text="${task.description}">Task Description</td>
        <td th:text="${task.getFormattedDate()}">2026-05-02 10:00</td>
        <td>
            <!-- Toggle Button -->
            <a th:href="@{/toggle-task/{id}(id=${task.id})}"
               class="btn btn-sm btn-outline-secondary">Check</a>

            <!-- Delete Button -->
            <a th:href="@{/delete-task/{id}(id=${task.id})}"
               class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
